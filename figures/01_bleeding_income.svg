  <g id="text_25">
   <text style="font-size: 9.5px; font-family: 'Inter'; fill: #555555" transform="translate(11.52 74.588076)">Excess spending on food, home energy and motor fuel during the Russia–Ukraine price shock,</text>
   <text style="font-size: 9.5px; font-family: 'Inter'; fill: #555555" transform="translate(11.52 90.736221)">March 2022 to December 2023, as a share of each income fifth's disposable income.</text>
  </g>
  <g id="text_26">
   <text style="font-size: 7.5px; font-family: 'Inter'; fill: #9a9a9a" transform="translate(11.52 408.510381)">* Assumes 55% of the poorest fifth claimed the €1,300 energietoeslag in both years; break-even is 32%.</text>
   <text style="font-size: 7.5px; font-family: 'Inter'; fill: #9a9a9a" transform="translate(11.52 421.253643)">Source: Eurostat HICP (prc_hicp_minr); CBS 85420NED, 85419NED, 83932NED. Midpoint CBS energy-method correction.</text>
