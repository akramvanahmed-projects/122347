  <g id="text_24">
   <text style="font-weight: 700; font-size: 14px; font-family: 'Inter'; fill: #1f1f1f" transform="translate(11.52 25.332314)">Support carried the poorest fifth while it lasted.</text>
   <text style="font-weight: 700; font-size: 14px; font-family: 'Inter'; fill: #1f1f1f" transform="translate(11.52 46.479287)">Over the whole period, every fifth paid.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 9.5px; font-family: 'Inter'; fill: #555555" transform="translate(11.52 74.588076)">Excess spending on food, home energy and motor fuel during the Russia–Ukraine price shock,</text>
   <text style="font-size: 9.5px; font-family: 'Inter'; fill: #555555" transform="translate(11.52 90.680557)">March 2022 to August 2026, as a share of each income fifth's disposable income.</text>
  </g>
  <g id="text_26">
   <text style="font-size: 7.5px; font-family: 'Inter'; fill: #9a9a9a" transform="translate(11.52 396.016143)">Support (€380 for all, €1,300 energietoeslag in 2022 and 2023) assumes 55% take-up in the poorest fifth.</text>
   <text style="font-size: 7.5px; font-family: 'Inter'; fill: #9a9a9a" transform="translate(11.52 408.554326)">After 2023 the war's price level is held at its late-2023 excess.</text>
   <text style="font-size: 7.5px; font-family: 'Inter'; fill: #9a9a9a" transform="translate(11.52 421.253643)">Source: Eurostat HICP (prc_hicp_minr); CBS 85420NED, 85419NED, 83932NED. Midpoint CBS energy-method correction.</text>
  </g>
