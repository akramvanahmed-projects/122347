name: Update data

on:
  push:
    branches: [main]
    paths: ["src/**", "config.yaml", "tests/**", "data/external/**", ".github/workflows/**"]
  schedule:
    - cron: "17 6 3 * *"   # monthly, after Eurostat publishes the previous month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: pytest -q

      - name: Fetch and analyse
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p data/processed
          python -m warcost fetch 2>&1 | tee data/processed/build_log.txt
          python -m warcost analyse 2>&1 | tee -a data/processed/build_log.txt

      - name: Surface errors
        if: steps.build.outcome != 'success'
        run: |
          grep -E "Error|error|Traceback|File \"|raise|^\s+\^" data/processed/build_log.txt | tail -25 |
            while IFS= read -r line; do echo "::error::${line}"; done

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          if [ -d reports ]; then git add reports; fi
          git diff --cached --quiet || git commit -m "refresh data [skip ci]"
          git pull --rebase
          git push

      - if: steps.build.outcome != 'success'
        run: exit 1
