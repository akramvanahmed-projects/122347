# Every number here is either a pointer to a data source or a modelling
# assumption. Assumptions are marked ASSUMPTION and have a stated range where
# the results are sensitive to them.

# One window for every number: from the invasion to the latest month with price
# data. Channels without measurements for part of the window count zero there.
window:
  start: "2022-03"
  end: null                  # latest month available

episodes:
  ukraine:
    label: "Russia–Ukraine war"
    shock_month: "2022-02"   # invasion on 24 Feb; first affected month is March
    end_month: null          # runs to the end of the window
    # After the acute shock (Mar 2022 - Dec 2023) the price level the war left
    # behind is still counted, but no later inflation is attributed to it: each
    # category's excess is capped at its Oct-Dec 2023 average (and follows prices
    # down if they fall). ASSUMPTION
    acute_end: "2023-12"
    # From the Iran shock on, the Ukraine excess is frozen at its Feb 2026 value,
    # so the two wars never claim the same price rise.
    freeze_from: "2026-02"
  iran:
    label: "Iran war"
    shock_month: "2026-02"   # strikes began late February 2026
    end_month: null          # latest month available

counterfactual:
  # "target": prices keep growing from their shock-month level at target_rate.
  # "pre_trend": each category keeps its own average growth over the
  # pre_trend_months before the shock (floored at 0).
  method: "target"
  target_rate: 0.02
  pre_trend_months: 24

# The headline counts only the categories a war shock hits directly.
# Excess "core" inflation (wages, services, rents) has too many other causes
# in 2022 (post-Covid reopening, a tight labour market) to attribute to the war.
direct_channels: ["food", "home_energy", "motor_fuel"]

# Before June 2023 the Dutch energy index priced new contracts only. CBS later
# recomputed it with existing contracts. Anchored at Feb 2022, the published
# series undercounts what fixed-contract households paid in 2023; the
# recomputed one also counts the delayed pass-through of the autumn 2021 gas
# spike, which predates the war. The truth is between them.
# 0 = published, 1 = CBS recomputation, 0.5 = midpoint (central case).
energy_correction_weight: 0.5
energy_research_series: "data/external/cbs_cpi_energy_method_research_series.csv"

prices:
  dataset: "prc_hicp_minr"   # Eurostat HICP, ECOICOP 2, monthly
  geo: "NL"
  unit: "I15"                # 2015=100, continuous through 2026
  start: "2014-01"           # covers both CBS survey years
  coicop:                    # category -> ECOICOP 2 code(s), first match wins
    food: ["CP01"]
    home_energy: ["CP045"]
    motor_fuel: ["CP0722"]
    core: ["TOT_X_NRG_FOOD", "TOTAL_X_NRG_FOOD"]
    all_items: ["CP00", "TOTAL", "TOT"]

cbs:
  shares_table: "85420NED"     # spending shares by household group, 2015 and 2020
  spending_table: "85419NED"   # average spending in €1000 by household group
  income_table: "83932NED"     # disposable income by decile, 2011-2024
  survey_year: "2020"          # 2015 is available as a sensitivity check
  # Category rows are matched on the COICOP code that prefixes each CBS label.
  categories:
    total: "000000"
    food: "010000"
    home_energy: "045000"
    motor_fuel: "072200"
    imputed_rent: "042000"
  quintile_label: "Besteedbaar inkomen: {n}e 20%-groep"
  all_households_label: "Particuliere huishoudens"
  income_concept: "Besteedbaar inkomen"
  income_decile_label: "Inkomen: {n}e 10%-groep"

# Transfers that do not show up in the price index. The 2023 price ceiling is
# inside CPI and HICP; the Nov–Dec 2022 discount is not (CBS, 2022).
compensation:
  - name: "Energy discount Nov–Dec 2022"
    episode: ukraine
    eur_per_household: [380, 380, 380, 380, 380]
  - name: "Energietoeslag 2022"
    episode: ukraine
    amount: 1300
    take_up_by_quintile: [0.55, 0.10, 0.0, 0.0, 0.0]   # ASSUMPTION: ~88% reach of eligible (SZW 2024) x ~62% of Q1 eligible [citation needed]
  - name: "Energietoeslag 2023"
    episode: ukraine
    amount: 1300
    take_up_by_quintile: [0.55, 0.10, 0.0, 0.0, 0.0]   # ASSUMPTION: ~88% reach of eligible (SZW 2024) x ~62% of Q1 eligible [citation needed]
  - name: "Commuting allowance €0.23→€0.25/km, 2026"
    episode: iran
    eur_per_household: [10, 25, 40, 55, 60]            # ASSUMPTION [citation needed]

human_cost:
  life_expectancy: 82.0          # NL at birth, CBS [citation needed: exact year]
  le_gap_years: 8.5              # Q5 vs Q1, men ~9, women ~8 (CBS, 2022)
  hle_gap_years: 18.0            # healthy life expectancy, income only (CBS, ~2012) [citation needed]
  exposure_years: 60             # ASSUMPTION: adult years over which the gradient builds
  causal_share: {low: 0.10, central: 0.25, high: 0.50}   # ASSUMPTION [citation needed]

indicators:
  source: "CBS/TNO, 'Afname energiearmoede stagneert in 2025' (2026). 2023–2025 preliminary."
  energy_poverty_pct: {"2019": 9.9, "2020": 6.9, "2021": 6.8, "2022": 4.1, "2023": 3.7, "2024": 6.0, "2025": 6.0}
  kept_out_by_support_pct: {"2022": 1.8, "2023": 4.3}

# ---------------------------------------------------------------------------
# Casualty ledger: dead, wounded and lost time. Every parameter carries its
# source; values marked ASSUMPTION have a low/central/high range.
# ---------------------------------------------------------------------------
casualties:
  cold:
    # Elasticity of all-cause mortality to the winter heating price.
    # Chirakijja, Jayachandran & Ong (2023), Economic Journal 134(657): 0.032 (SE 0.014).
    elasticity: {low: 0.0046, central: 0.032, high: 0.059}      # central +/- 1.96 SE
    # Every heating season in the window. A season whose heating price was at or
    # below the no-war path counts zero (no lives "saved" are credited).
    heating_seasons: [["2022-10", "2023-03"], ["2023-10", "2024-03"], ["2024-10", "2025-03"], ["2025-10", "2026-03"]]
    # Expected deaths per season, from CBS weekly expected deaths
    # (about 3,050-3,460 a week in Dec 2022 - Jan 2023): 26 weeks x ~3,150.
    # Held at that level for later seasons. ASSUMPTION (deaths drift up ~1% a year)
    expected_deaths: 82000
    observed_excess_dec_jan: 4800     # CBS weekly table, weeks 48/2022-4/2023 (own sum)
  wounded:
    # Disability weights. GBD mild anxiety = 0.030 is used as the upper bound for
    # financial worry, which is not itself a GBD health state. ASSUMPTION
    worry_weight: {low: 0.005, central: 0.010, high: 0.030}
    hardship_weight: {low: 0.030, central: 0.060, high: 0.133}  # up to GBD moderate anxiety
    adults: 14200000
    # CBS, share of adults with many worries about their financial future
    # (Meer mensen tevreden over financiën in 2024, 2025). Later years not yet published: counted 0.
    money_worry_base_pct: 22.5         # 2021
    money_worry_pct: {"2022": 28.6, "2023": 28.7, "2024": 26.1}
    war_worry_pct: 39                  # NCTV, 10 Mar 2022: worry "a lot"
    war_worry_years: 0.1667            # about two months at that intensity. ASSUMPTION
    # Voedselbanken Nederland, people helped during the year. 2023: Feiten en cijfers
    # per 31-12-2023. 2025: NOS, 2 Jun 2026 ("ruim 155.000", 11,000 more than 2024).
    food_aid_base: 147500              # 2021
    food_aid: {"2022": 197000, "2023": 180579, "2024": 144000, "2025": 155000}
    missed_support_years: 1.83         # the support years, Mar 2022 - Dec 2023 (22 months)
    holiday_population: 15000000       # people aged 15+, approximate
    # CBS no-holiday share, people 15+: 2019 18.5%, 2022 20.2%, 2023 19.2%. Upper bound.
    # 2024 onwards not in our sources: counted 0.
    holiday_base_pct: 18.5
    no_holiday_pct: {"2022": 20.2, "2023": 19.2}
    cold_home_households: 5100000      # 7 in 10 of ~7.3m gas-heated homes lowered the thermostat. ASSUMPTION on base
